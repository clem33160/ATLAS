name: D8 sealed transport relay
on:
  push:
    branches: [d8-legacy-preservation]
    paths: ['.github/workflows/d8-sealed-transport.yml']
permissions:
  contents: read
jobs:
  relay:
    if: github.repository == 'clem33160/ATLAS' && github.run_number <= 1 && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Retrieve ciphertext and verify exact transport hashes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/d8-sealed-relay"
          cd "$RUNNER_TEMP/d8-sealed-relay"
          curl --proto '=https' --tlsv1.2 --fail --retry 3 --max-time 45 -o transport.json https://axis-d8-sealed-recovery-20260921.onrender.com/transport.json
          curl --proto '=https' --tlsv1.2 --fail --retry 3 --max-time 90 -o sealed-backup.txt https://axis-d8-sealed-recovery-20260921.onrender.com/sealed-backup.txt
          python3 - <<'PY'
          import base64,hashlib,json,pathlib
          p=pathlib.Path('.')
          m=json.loads((p/'transport.json').read_text())
          assert m['plaintext_published'] is False
          assert m['recipient_certificate_sha256']=='786c9206e305b7f5160f9b726a345a9d3cfa75c46d8dd194f16f724fbb2775f7'
          assert 0<m['cipher_bytes']<200_000_000
          raw=(p/'sealed-backup.txt').read_bytes()
          assert hashlib.sha256(raw).hexdigest()==m['base64_sha256']
          cipher=base64.b64decode(raw,validate=True)
          assert len(cipher)==m['cipher_bytes']
          assert hashlib.sha256(cipher).hexdigest()==m['cipher_sha256']
          (p/'sealed-backup.cms').write_bytes(cipher)
          print(json.dumps({'cipher_sha256':m['cipher_sha256'],'cipher_bytes':len(cipher),'transport_verified':True,'plaintext_accessed':False}))
          PY
      - name: Retain ciphertext only for authorized recovery
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: d8-sealed-relay-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/d8-sealed-relay/sealed-backup.cms
            ${{ runner.temp }}/d8-sealed-relay/transport.json
          retention-days: 90
          if-no-files-found: error
